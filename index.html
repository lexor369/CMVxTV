<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <title>CMV LIVE - Watch Live</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #111827; color: #E5E7EB; font-family: 'Inter', sans-serif; }
        .card { background-color: #1F2937; border: 1px solid #3B82F6; border-radius: 0.75rem; padding: 1rem; text-align: center; transition: all 0.2s ease-in-out; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); cursor: pointer; }
        .card:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); border-color: #60A5FA; }
        .logo { width: 80px; height: 60px; margin: 0 auto 0.5rem auto; object-fit: contain; border-radius: 0.375rem; background-color: #374151; }
        .search-bar { background-color: #374151; border: 1px solid #4B5563; border-radius: 0.5rem; padding: 0.625rem 1rem; color: #F3F4F6; width: 100%; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
        .search-bar:focus { outline: none; border-color: #3B82F6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4); }
        .search-btn { background-color: #3B82F6; color: white; padding: 0.625rem 1.25rem; border-radius: 0.5rem; margin-left: 0.75rem; transition: background-color 0.2s ease; font-weight: 600; }
        .search-btn:hover { background-color: #2563EB; }
        .channel-name { color: #D1D5DB; font-weight: 600; font-size: 0.875rem; line-height: 1.25rem; margin-bottom: 0.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .branding-text { color: #6B7280; font-size: 0.75rem; line-height: 1rem; }
    </style>
</head><body>
    <header class="p-4 md:p-6 flex items-center justify-center flex-col border-b border-blue-600 shadow-md">
        <h1 class="text-3xl md:text-4xl font-bold text-blue-500 mb-4">CMV LIVE</h1>
        <div class="flex w-full max-w-lg">
            <input id="searchBox" type="text" placeholder="Search channels..." class="search-bar flex-1">
            <button class="search-btn" onclick="filterChannels()">Search</button>
        </div>
    </header>
    <main class="p-4 md:p-6">
        <div id="channelGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
            <div class="text-center col-span-full py-10">Loading channels...</div>
        </div>
    </main>
    <script>
        async function loadJSON() {
            const url = "https://pkll.xojiv79335.workers.dev/";
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                return data.map(ch => ({
                    id: ch.id || ch.channel_id,
                    name: ch.name || ch.channel_name,
                    logo: ch.logo || ch.channel_logo || 'https://placehold.co/80x60/1F2937/E5E7EB?text=No+Logo'
                })).filter(ch => ch.id);
            } catch (error) {
                console.error("Failed to load JSON:", error);
                document.getElementById("channelGrid").innerHTML = '<div class="text-center col-span-full py-10 text-red-500">Failed to load.</div>';
                return [];
            }
        }
        function renderChannels(channels) {
            const grid = document.getElementById("channelGrid");
            grid.innerHTML = "";
            const playerPage = "./player.html";
            channels.forEach(ch => {
                const div = document.createElement("div");
                div.className = "card";
                div.innerHTML = `<img src="${ch.logo}" class="logo" alt="${ch.name}" onerror="this.src='https://placehold.co/80x60/1F2937/E5E7EB?text=No+Logo';"><h2 class="channel-name">${ch.name}</h2><p class="branding-text">CMV LIVE</p>`;
                div.onclick = () => { window.open(`${playerPage}?id=${ch.id}`, "_blank"); };
                grid.appendChild(div);
            });
        }
        let allChannels = [];
        async function initApp() { allChannels = await loadJSON(); renderChannels(allChannels); }
        function filterChannels() {
            const term = document.getElementById("searchBox").value.toLowerCase().trim();
            const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(term));
            renderChannels(filtered);
        }
        document.getElementById("searchBox").addEventListener("keypress", (e) => { if (e.key === "Enter") filterChannels(); });
        document.addEventListener("DOMContentLoaded", initApp);
    </script>
</body></html>
