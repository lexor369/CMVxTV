<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <title>CMV LIVE - Watch Live</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* RESTORED ORIGINAL STYLES */
        body { background-color: #111827; color: #E5E7EB; font-family: 'Inter', sans-serif; }
        .card { background-color: #1F2937; border: 1px solid #3B82F6; border-radius: 0.75rem; padding: 1rem; text-align: center; transition: all 0.2s ease-in-out; cursor: pointer; }
        .card:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        .logo { width: 80px; height: 60px; margin: 0 auto 0.5rem auto; object-fit: contain; border-radius: 0.375rem; background-color: #374151; }
        .search-bar { background-color: #374151; border: 1px solid #4B5563; border-radius: 0.5rem; padding: 0.625rem 1rem; color: #F3F4F6; width: 100%; }
        .channel-name { color: #D1D5DB; font-weight: 600; font-size: 0.875rem; }
        .branding-text { color: #6B7280; font-size: 0.75rem; }
    </style>
</head><body>
    <header class="p-4 flex flex-col items-center border-b border-blue-600">
        <h1 class="text-3xl font-bold text-blue-500 mb-4">CMV LIVE</h1>
        <div class="flex w-full max-w-lg">
            <input id="searchBox" type="text" placeholder="Search channels..." class="search-bar">
        </div>
    </header>
    <main class="p-4">
        <div id="channelGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
    </main>
    <script>
        async function initApp() {
            const res = await fetch("https://pkll.xojiv79335.workers.dev/");
            const data = await res.json();
            const grid = document.getElementById("channelGrid");
            grid.innerHTML = "";
            data.forEach(ch => {
                const id = ch.id || ch.channel_id;
                const name = ch.name || ch.channel_name;
                const logo = ch.logo || ch.channel_logo;
                const div = document.createElement("div");
                div.className = "card";
                div.innerHTML = `<img src="${logo}" class="logo"><h2 class="channel-name">${name}</h2><p class="branding-text">CMV LIVE</p>`;
                // FIXED REDIRECT:
                div.onclick = () => { window.location.href = `player.html?id=${id}`; };
                grid.appendChild(div);
            });
        }
        document.addEventListener("DOMContentLoaded", initApp);
    </script>
</body></html>
