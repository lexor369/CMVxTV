<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CMV LIVE - Watch Live</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #111827; /* Darker blue-gray */
            color: #E5E7EB; /* Light gray */
            font-family: 'Inter', sans-serif;
        }
        .card {
            background-color: #1F2937; /* Slightly lighter blue-gray */
            border: 1px solid #3B82F6; /* Blue border */
            border-radius: 0.75rem; /* Equivalent to rounded-xl */
            padding: 1rem; /* Equivalent to p-4 */
            text-align: center;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            cursor: pointer;
        }
        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); /* Blue glow */
            border-color: #60A5FA; /* Lighter blue border on hover */
        }
        .logo {
            width: 80px; /* Adjusted size */
            height: 60px; /* Adjusted size */
            margin: 0 auto 0.5rem auto; /* Centered with bottom margin */
            object-fit: contain;
            border-radius: 0.375rem; /* rounded-md */
        }
        .search-bar {
            background-color: #374151; /* Medium gray */
            border: 1px solid #4B5563; /* Gray border */
            border-radius: 0.5rem; /* rounded-lg */
            padding: 0.625rem 1rem; /* Adjusted padding */
            color: #F3F4F6; /* Lighter gray text */
            width: 100%;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .search-bar:focus {
            outline: none;
            border-color: #3B82F6; /* Blue border on focus */
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4); /* Blue ring on focus */
        }
        .search-btn {
            background-color: #3B82F6; /* Blue button */
            color: white;
            padding: 0.625rem 1.25rem; /* Adjusted padding */
            border-radius: 0.5rem; /* rounded-lg */
            margin-left: 0.75rem; /* ml-3 */
            transition: background-color 0.2s ease;
            font-weight: 600; /* semibold */
        }
        .search-btn:hover {
            background-color: #2563EB; /* Darker blue on hover */
        }
        /* Add placeholder style */
        .search-bar::placeholder {
            color: #9CA3AF; /* Gray placeholder */
        }
        /* Style for channel name */
        .channel-name {
             color: #D1D5DB; /* Slightly darker light gray */
             font-weight: 600; /* semibold */
             font-size: 0.875rem; /* text-sm */
             line-height: 1.25rem;
             margin-bottom: 0.25rem; /* mb-1 */
             /* Ensure text doesn't overflow */
             white-space: nowrap;
             overflow: hidden;
             text-overflow: ellipsis;
        }
        /* Style for branding text */
        .branding-text {
            color: #6B7280; /* Medium gray */
            font-size: 0.75rem; /* text-xs */
            line-height: 1rem;
        }
        /* Ensure images have a background color while loading or if broken */
        img.logo {
             background-color: #374151;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200">

    <!-- Header -->
    <header class="p-4 md:p-6 flex items-center justify-center flex-col border-b border-blue-600 shadow-md">
        <h1 class="text-3xl md:text-4xl font-bold text-blue-500 mb-4">CMV LIVE</h1>
        <div class="flex w-full max-w-lg">
            <input id="searchBox" type="text" placeholder="Search channels..." class="search-bar flex-1">
            <button class="search-btn" onclick="filterChannels()">Search</button>
        </div>
    </header>

    <!-- Channel Grid -->
    <main class="p-4 md:p-6">
        <div id="channelGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
            <!-- Channel cards will be loaded here by JavaScript -->
            <div class="text-center col-span-full py-10">Loading channels...</div>
        </div>
    </main>

    <script>
        // Fetches and parses the M3U playlist
        async function loadM3U() {
            // URL of the M3U playlist
            const url = "https://raw.githubusercontent.com/alex8875/m3u/refs/heads/main/jstar.m3u";
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const text = await response.text();
                const lines = text.split("\n");
                let channels = [];
                let current = {};

                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith("#EXTINF")) {
                         // Extract channel name, logo, and ID using regex
                        const nameMatch = line.match(/,(.+)$/);
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        const idMatch = line.match(/tvg-id="([^"]+)"/);

                        current = {
                            id: idMatch ? idMatch[1] : null,
                            name: nameMatch ? nameMatch[1].trim() : 'Unnamed Channel',
                            logo: logoMatch ? logoMatch[1] : 'https://placehold.co/80x60/1F2937/E5E7EB?text=No+Logo' // Fallback image
                        };
                    } else if (line.startsWith("http") && current.id) {
                        // If the line starts with http and we have channel info, add it
                        channels.push(current);
                        current = {}; // Reset for the next channel
                    } else if (!line.startsWith("#") && !line.startsWith("http")) {
                         // Reset if we encounter unexpected lines between EXTINF and URL
                         current = {};
                    }
                });
                // Filter out any potential placeholder/invalid entries based on name
                return channels.filter(ch => ch.id && ch.name && !ch.name.toLowerCase().includes('ygxworld'));
            } catch (error) {
                console.error("Failed to load or parse M3U file:", error);
                document.getElementById("channelGrid").innerHTML = '<div class="text-center col-span-full py-10 text-red-500">Failed to load channels. Please check the console for details.</div>';
                return []; // Return empty array on error
            }
        }

        // Renders the channel cards onto the grid
        function renderChannels(channels) {
            const grid = document.getElementById("channelGrid");
            grid.innerHTML = ""; // Clear previous content or loading message

            if (channels.length === 0) {
                 grid.innerHTML = '<div class="text-center col-span-full py-10">No channels found.</div>';
                 return;
            }

            // --- *** RELATIVE PATH TO PLAYER *** ---
            const playerPage = "./player.html"; // Assumes player.html is in the same directory

            channels.forEach(ch => {
                const div = document.createElement("div");
                div.className = "card";
                div.innerHTML = `
                    <img src="${ch.logo}" class="logo" alt="${ch.name} Logo" onerror="this.onerror=null; this.src='https://placehold.co/80x60/1F2937/E5E7EB?text=No+Logo';">
                    <h2 class="channel-name">${ch.name}</h2>
                    <p class="branding-text">CMV LIVE</p>
                `;
                // Set the click event to open the player page using the relative path
                div.onclick = () => {
                    window.open(`${playerPage}?id=${ch.id}`, "_blank");
                };
                grid.appendChild(div);
            });
        }

        // Global variable to store all loaded channels
        let allChannels = [];

        // Initializes the application: loads channels and renders them
        async function initApp() {
            allChannels = await loadM3U();
            renderChannels(allChannels);
        }

        // Filters channels based on the search input
        function filterChannels() {
            const searchTerm = document.getElementById("searchBox").value.toLowerCase().trim();
            const filteredChannels = allChannels.filter(ch =>
                ch.name.toLowerCase().includes(searchTerm) || (ch.id && ch.id.toLowerCase().includes(searchTerm))
            );
            renderChannels(filteredChannels);
        }

        // Add event listener for Enter key in search box
        document.getElementById("searchBox").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault(); // Prevent form submission if it were in a form
                filterChannels();
            }
        });

        // Load channels when the page is ready
        document.addEventListener("DOMContentLoaded", initApp);
    </script>
</body>
</html>
