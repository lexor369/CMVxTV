<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMV LIVE - Pro Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #000; height: 100vh; width: 100vw; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; color: white; }
        [data-shaka-player-container] { position: absolute; inset: 0; background: #000; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .shaka-spinner-container { display: none !important; }
        .channel-info { position: absolute; top: 0; left: 0; right: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%); padding: 1rem; display: flex; align-items: center; z-index: 10; }
        .channel-logo { width: 40px; height: 40px; margin-right: 15px; border-radius: 8px; background: #222; object-fit: contain; }
        .channel-name { font-size: 1.1rem; font-weight: 500; }
        .blur-bg { position: fixed; inset: 0; backdrop-filter: blur(4px); background: rgba(0, 0, 0, 0.5); display: none; z-index: 50; }
        .alert-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 12px; text-align: center; color: black; width: 320px; z-index: 100; display: none; }
        .alert-box button { margin: 5px; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .join-btn { background: #3498db; color: white; }
        .close-btn { background: #2ecc71; color: white; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="channel-info" id="channelInfo">
        <img class="channel-logo" id="channelLogo" src="" alt="">
        <div class="channel-name" id="channelName">Connecting...</div>
    </div>
    <div data-shaka-player-container><video autoplay playsinline id="video"></video></div>
    <div id="loadingIndicator" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; text-align: center;">
        <div style="border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #3B82F6; width: 45px; height: 45px; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px;"></div>
        <p id="statusMsg">Bypassing Blocks...</p>
    </div>
    <div id="blur-bg" class="blur-bg"></div> 
    <div id="alert-box" class="alert-box">
        <p>Join Our Channel for More Match Links!</p>
        <button class="join-btn" onclick="window.open('https://t.me/+Jt-5CtcdaQY5MmU9', '_blank')">Join Channel</button>
        <button class="close-btn" onclick="closeAlert()">Already Joined</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mux.js@6.0.1/dist/mux.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>

    <script>
        const video = document.getElementById('video');
        const alertBox = document.getElementById('alert-box');
        const blurBg = document.getElementById('blur-bg');
        const statusMsg = document.getElementById('statusMsg');
        
        // Proxy Fallback List
        const proxies = [
            "https://cors-proxy.cooks.fyi/",
            "https://api.allorigins.win/raw?url=",
            "https://corsproxy.io/?"
        ];
        let currentProxyIndex = 0;

        function closeAlert() { alertBox.style.display = 'none'; blurBg.style.display = 'none'; }
        function getChannelId() { return new URLSearchParams(window.location.search).get('id'); }

        async function initPlayer(channelData) {
            shaka.polyfill.installAll();
            const player = new shaka.Player(video);
            const ui = new shaka.ui.Overlay(player, video.parentElement, video);
            
            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                request.headers['Referer'] = 'https://www.jiotv.com/';
                request.headers['User-Agent'] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
            });

            // Auto-fallback logic if a proxy fails
            player.addEventListener('error', async (error) => {
                if (error.detail.code === 1001 || error.detail.code === 1002) {
                    currentProxyIndex++;
                    if (currentProxyIndex < proxies.length) {
                        statusMsg.textContent = "Switching Proxy...";
                        await player.load(proxies[currentProxyIndex] + channelData.url, null, 'application/x-mpegurl');
                    }
                }
            });

            try {
                await player.load(proxies[currentProxyIndex] + channelData.url, null, 'application/x-mpegurl');
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('channelName').textContent = channelData.name;
                document.getElementById('channelLogo').src = channelData.logo;
                setTimeout(() => { alertBox.style.display = 'block'; blurBg.style.display = 'block'; }, 6000);
            } catch (e) {
                statusMsg.textContent = "All Proxies Blocked. Try VPN.";
            }
        }

        async function main() {
            const id = getChannelId();
            const dynamicUrl = "https://jiotvplaylist.teachub.workers.dev/?t=ads_ouo_10";
            try {
                const res = await fetch(dynamicUrl);
                const text = await res.text();
                const lines = text.split('\n');
                let channelData = null;
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes(`tvg-id="${id}"`) || lines[i].includes(decodeURIComponent(id))) {
                        channelData = {
                            name: lines[i].match(/,(.+)$/)[1].trim(),
                            logo: lines[i].match(/tvg-logo="([^"]+)"/)[1],
                            url: lines[i+1].trim()
                        };
                        break;
                    }
                }
                if (channelData) initPlayer(channelData);
            } catch (e) { statusMsg.textContent = "Worker Offline."; }
        }
        document.addEventListener('DOMContentLoaded', main);
    </script>
</body></html>
