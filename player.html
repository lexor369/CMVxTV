<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMV LIVE Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        [span_0](start_span)/* [cite: 1-5] Base styles */
        html, body { margin: 0; padding: 0; background: #000; height: 100%; width: 100%; overflow: hidden; font-family: 'Inter', sans-serif; color: #E5E7EB; position: relative; }
        [data-shaka-player-container] { position: absolute; inset: 0; background: #000; z-index: 1; }
        video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
        
        [cite_start]/*[span_0](end_span) Hide Shaka's built-in spinner */
        .shaka-spinner-container { display: none !important; }

        [span_1](start_span)/* [cite: 10-14] UI FIX: Hide the large central button */
        [data-shaka-player-container].shaka-playing > .shaka-controls-container > .shaka-play-button-container,
        [data-shaka-player-container][data-shaka-player-state="playing"] > .shaka-controls-container > .shaka-play-button-container,
        [data-shaka-player-container][data-shaka-player-state="buffering"] > .shaka-controls-container > .shaka-play-button-container {
            display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; z-index: -1 !important;
        }

        [cite_start]/* [cite: 16-21] Channel info overlay */
        .channel-info { position: absolute; top: 0; left: 0; right: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%); padding: 1rem; display: flex; align-items: center; z-index: 10; transition: opacity 0.3s ease; }
        .channel-info.hidden { opacity: 0; pointer-events: none; }
        .channel-logo { width: 40px; height: 40px; margin-right: 15px; border-radius: 8px; background: #222; object-fit: contain; }
        .channel-name { font-size: 1.1rem; font-weight: 500; color: white; }

        [cite_start]/* [cite: 22-27] Custom Loading Indicator */
        .loading-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; text-align: center; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); border-radius: 50%; border-top: 4px solid #3B82F6; width: 45px; height: 45px; animation: spin 0.8s linear infinite; margin: 0 auto 0.75rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        [cite_start]/* [cite: 35-48] Alert Box styling */
        .blur-bg { position: fixed; inset: 0; backdrop-filter: blur(4px); background: rgba(0, 0, 0, 0.5); display: none; z-index: 50; }
        .alert-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 12px; text-align: center; color: black; width: 320px; z-index: 100; display: none; }
        .alert-box button { margin: 10px 5px; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .join-btn { background: #3498db; color: white; }
        .close-btn { background: #2ecc71; color: white; }
    </style>
</head><body>

    <div class="channel-info hidden" id="channelInfo">
        <img class="channel-logo" id="channelLogo" src="" alt="">
        <div class="channel-name" id="channelName">Connecting...</div>
    </div>

    <div data-shaka-player-container>
        <video autoplay playsinline id="video"></video>
    </div>

    <div class="loading-indicator" id="loadingIndicator">
        <div class="spinner"></div>
        <p id="loadingText">Syncing Segments...</p>
    </div>

    <div id="blur-bg" class="blur-bg"></div> 
    <div id="alert-box" class="alert-box">
        <p style="font-size: 1.1rem; font-weight: 500;">Join Our Channel for High-Speed Match Links!</p>
        <button class="join-btn" onclick="window.open('https://t.me/+Jt-5CtcdaQY5MmU9', '_blank')">Join Channel</button>
        <button class="close-btn" onclick="closeAlert()">Already Joined</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mux.js@6.0.1/dist/mux.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>

    <script>
        const video = document.getElementById('video');
        const alertBox = document.getElementById('alert-box');
        const blurBg = document.getElementById('blur-bg');
        const loadingText = document.getElementById('loadingText');

        [cite_start]//[span_1](end_span) Alert logic
        function closeAlert() { alertBox.style.display = 'none'; blurBg.style.display = 'none'; }
        [span_2](start_span)//[span_2](end_span) Channel ID extraction
        function getChannelId() { return new URLSearchParams(window.location.search).get('id'); }

        async function init() {
            const id = getChannelId();
            if (!id) return;

            // Step 1: Fetch dynamic playlist
            const dynamicUrl = "https://jiotvplaylist.teachub.workers.dev/?t=ads_ouo_10";
            try {
                const res = await fetch(dynamicUrl);
                const text = await res.text();
                const lines = text.split('\n');
                let channel = null;

                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes(`tvg-id="${id}"`) || lines[i].includes(decodeURIComponent(id))) {
                        channel = {
                            name: lines[i].match(/,(.+)$/)[1].trim(),
                            logo: lines[i].match(/tvg-logo="([^"]+)"/)[1],
                            url: lines[i+1].trim()
                        };
                        break;
                    }
                }

                if (!channel) return;

                // Step 2: Initialize Shaka
                shaka.polyfill.installAll();
                const player = new shaka.Player(video);
                const ui = new shaka.ui.Overlay(player, video.parentElement, video);
                
                [span_3](start_span)// [cite: 84-85] UI Configuration
                ui.configure({ 
                    'fadeDelaySeconds': 3.5,
                    'controlPanelElements': ['play_pause', 'time_and_duration', 'spacer', 'mute', 'volume', 'quality', 'fullscreen']
                });

                [cite_start]//[span_3](end_span) Authorized JioTV Headers & Proxy Bypass
                player.getNetworkingEngine().registerRequestFilter((type, request) => {
                    request.headers['Referer'] = 'https://www.jiotv.com/';
                    request.headers['User-Agent'] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
                    
                    // Route video segments through proxy to bypass browser security blocks
                    if (type === shaka.net.NetworkingEngine.RequestType.SEGMENT) {
                        request.uris[0] = "https://cors-proxy.cooks.fyi/" + request.uris[0];
                    }
                });

                // Step 3: Load using Proxy for Manifest
                const proxiedUrl = "https://cors-proxy.cooks.fyi/" + channel.url;
                await player.load(proxiedUrl, null, 'application/x-mpegurl');
                
                // Success - Update UI
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('channelName').textContent = channel.name;
                document.getElementById('channelLogo').src = channel.logo;
                document.getElementById('channelInfo').classList.remove('hidden');

                [span_4](start_span)//[span_4](end_span) Show popup after delay
                setTimeout(() => {
                    alertBox.style.display = 'block';
                    blurBg.style.display = 'block';
                }, 6000);

            } catch (e) { 
                loadingText.textContent = "Stream blocked. Try refreshing.";
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body></html>
