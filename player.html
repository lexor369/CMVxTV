<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMV LIVE - Pro Player</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Core Layout */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #000; height: 100vh; width: 100vw; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
        [data-shaka-player-container] { position: absolute; inset: 0; background: #000; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* PRO UI: Kill Default Shaka Spinners */
        .shaka-spinner-container, .shaka-spinner, .shaka-buffering-spinner {
            display: none !important; opacity: 0 !important; visibility: hidden !important;
        }

        /* Top Channel Info Overlay */
        .channel-info {
            position: absolute; top: 0; left: 0; right: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            padding: 1rem; display: flex; align-items: center; z-index: 10; transition: opacity 0.3s ease;
        }
        .channel-logo { width: 40px; height: 40px; margin-right: 15px; border-radius: 8px; background: #222; object-fit: contain; }
        .channel-name { font-size: 1.1rem; font-weight: 500; color: white; }

        /* SportsEera Style Blurred Alert */
        .blur-bg { position: fixed; inset: 0; backdrop-filter: blur(4px); background: rgba(0, 0, 0, 0.5); display: none; z-index: 50; }
        .alert-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 12px; text-align: center; color: black; width: 320px; z-index: 100; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .alert-box p { font-size: 1.1rem; margin-bottom: 20px; font-weight: 500; }
        .alert-box button { margin: 5px; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        .join-btn { background: #3498db; color: white; }
        .close-btn { background: #2ecc71; color: white; }

        /* Custom Volume & Seek Bar Styling */
        .shaka-controls-container .shaka-volume-bar-container { background: rgba(255,255,255,0.3); }
        .shaka-seek-bar-container { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div class="channel-info" id="channelInfo">
        <img class="channel-logo" id="channelLogo" src="" alt="" onerror="this.style.display='none'">
        <div class="channel-name" id="channelName">Connecting...</div>
    </div>

    <div data-shaka-player-container class="shaka-video-container">
        <video autoplay playsinline id="video"></video>
    </div>

    <div id="loadingIndicator" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; color: white; text-align: center;">
        <div style="border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #3B82F6; width: 45px; height: 45px; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px;"></div>
        <p style="font-size: 0.9rem; opacity: 0.8;">Authorizing Stream...</p>
    </div>

    <div id="blur-bg" class="blur-bg"></div> 
    <div id="alert-box" class="alert-box">
        <p>Join Our Channel for More Match Links Or Support!</p>
        <button class="join-btn" onclick="window.open('https://t.me/+Jt-5CtcdaQY5MmU9', '_blank')">Join Channel</button>
        <button class="close-btn" onclick="closeAlert()">Already Joined</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mux.js@6.0.1/dist/mux.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>

    <script>
        const video = document.getElementById('video');
        const alertBox = document.getElementById('alert-box');
        const blurBg = document.getElementById('blur-bg');
        const loader = document.getElementById('loadingIndicator');

        function closeAlert() { alertBox.style.display = 'none'; blurBg.style.display = 'none'; }
        function getChannelId() { return new URLSearchParams(window.location.search).get('id'); }

        async function init() {
            const id = getChannelId();
            if(!id) return;

            // Step 1: Fetch Dynamic Playlist from Teachub Worker
            const dynamicUrl = "https://jiotvplaylist.teachub.workers.dev/?t=ads_ouo_10";
            try {
                const res = await fetch(dynamicUrl);
                const text = await res.text();
                const lines = text.split('\n');
                let channelData = null;

                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes(`tvg-id="${id}"`) || lines[i].includes(decodeURIComponent(id))) {
                        channelData = {
                            name: lines[i].match(/,(.+)$/)[1].trim(),
                            logo: lines[i].match(/tvg-logo="([^"]+)"/)[1],
                            url: lines[i+1].trim()
                        };
                        break;
                    }
                }

                if (!channelData) throw new Error("Channel not found");

                // Step 2: Initialize Shaka Player
                shaka.polyfill.installAll();
                const player = new shaka.Player(video);
                const ui = new shaka.ui.Overlay(player, video.parentElement, video);
                
                ui.configure({
                    'controlPanelElements': ['play_pause', 'time_and_duration', 'spacer', 'mute', 'volume', 'quality', 'fullscreen']
                });

                // Step 3: Register Mandatory Headers for the Worker
                player.getNetworkingEngine().registerRequestFilter((type, request) => {
                    request.headers['Referer'] = 'https://www.jiotv.com/';
                    request.headers['User-Agent'] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
                });

                // Step 4: Load Stream with Forced HLS Type
                await player.load(channelData.url, null, 'application/x-mpegurl');
                
                // Success - Hide Loader and Update UI
                loader.style.display = 'none';
                document.getElementById('channelName').textContent = channelData.name;
                document.getElementById('channelLogo').src = channelData.logo;
                
                // Show Popup Alert after 6 seconds
                setTimeout(() => {
                    alertBox.style.display = 'block';
                    blurBg.style.display = 'block';
                }, 6000);

            } catch (e) {
                console.error(e);
                document.getElementById('loadingText').textContent = "Stream Error: Try again later.";
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
    <style> @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } </style>
</body></html>
