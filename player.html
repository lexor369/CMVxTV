<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMV LIVE Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ALL ORIGINAL STYLES REMAIN INTACT */
        html, body { margin: 0; padding: 0; background: #000; height: 100%; width: 100%; overflow: hidden; font-family: 'Inter', sans-serif; color: #E5E7EB; position: relative; }
        [data-shaka-player-container] { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 1; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .shaka-spinner-container { display: none !important; }
        [span_14](start_span)/* Force Hide Central Play Button [cite: 10-14] */
        [data-shaka-player-container].shaka-playing > .shaka-controls-container > .shaka-play-button-container,
        [data-shaka-player-container][data-shaka-player-state="playing"] > .shaka-controls-container > .shaka-play-button-container { display: none !important; visibility: hidden !important; }
        .channel-info { position: absolute; top: 0; left: 0; right: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%); padding: 0.5rem; display: flex; align-items: center; z-index: 10; transition: opacity 0.3s ease; pointer-events: none; }
        .channel-info.hidden { opacity: 0; }
        .channel-logo { width: 32px; height: 32px; margin-right: 0.75rem; border-radius: 0.25rem; object-fit: contain; }
        [cite_start]/* Alert/Popup Design [cite: 35-48] */
        .alert-overlay-base { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 50; opacity: 0; visibility: hidden; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .alert-overlay-base.visible { opacity: 1; visibility: visible; }
        .alert-box { background: #1F2937; padding: 1.5rem; border-radius: 0.75rem; text-align: center; width: 90%; max-width: 350px; }
        .join-btn { background: #3B82F6; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; margin: 0.5rem; font-weight: 600; }
        .close-btn { background: #10B981; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; margin: 0.5rem; font-weight: 600; }
        [cite_start]/* Custom Shaka Volume Colors [cite: 49-51] */
        .shaka-controls-container .shaka-volume-bar-container { --volume-percent: 80%; background: linear-gradient(to right, #e5e7eb var(--volume-percent), #3b82f6 var(--volume-percent)); }
    </style>
</head><body>
    <div class="channel-info hidden" id="channelInfo">
        <img class="channel-logo" id="channelLogo" src="" alt="Logo">
        <div class="channel-name" id="channelName">Loading...</div>
    </div>
    <div data-shaka-player-container>
        <video autoplay playsinline id="video"></video>
    </div>
    <div class="loading-indicator" id="loadingIndicator" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:5;">
        <div class="spinner" style="border:4px solid rgba(255,255,255,0.3); border-top:4px solid #3B82F6; width:40px; height:40px; border-radius:50%; animation:spin 1s linear infinite;"></div>
        <p id="loadingText" style="text-align:center; margin-top:10px;">Initializing Player...</p>
    </div>
    <div id="alertOverlay" class="alert-overlay-base">
        <div class="alert-box">
            <p>Join our Channel for More Content & Support!</p>
            <button class="join-btn" onclick="window.open('https://t.me/cricketmemesverse873', '_blank')">Join Channel</button>
            <button class="close-btn" onclick="closeAlert()">Close</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
    <script>
        const video = document.getElementById('video');
        const alertOverlay = document.getElementById('alertOverlay');
        const channelInfo = document.getElementById('channelInfo');
        let player, ui;

        function getChannelIdFromUrl() { return new URLSearchParams(window.location.search).get('id'); }
        function showAlert() { alertOverlay.classList.add('visible'); }
        function closeAlert() { alertOverlay.classList.remove('visible'); }

        async function fetchChannelData(channelId) {
            [cite_start]const m3uUrl = "https://raw.githubusercontent.com/tvbd/m3uplayer/refs/heads/main/m3u/nexgen.m3u";[span_14](end_span)
            try {
                const res = await fetch(m3uUrl);
                const text = await res.text();
                const lines = text.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].includes(`tvg-id="${channelId}"`) || lines[i].includes(decodeURIComponent(channelId))) {
                        const nameMatch = lines[i].match(/,(.+)$/);
                        const logoMatch = lines[i].match(/tvg-logo="([^"]+)"/);
                        return {
                            name: nameMatch ? nameMatch[1].trim() : 'Channel',
                            logo: logoMatch ? logoMatch[1] : '',
                            url: lines[i+1].trim()
                        };
                    }
                }
            } catch (e) { return null; }
        }

        async function initPlayer(channel) {
            [span_15](start_span)shaka.polyfill.installAll();[span_15](end_span)
            player = new shaka.Player(video);
            const uiContainer = video.parentElement;
            [span_16](start_span)ui = new shaka.ui.Overlay(player, uiContainer, video);[span_16](end_span)
            
            ui.configure({ 
                [span_17](start_span)'fadeDelaySeconds': 3.5,[span_17](end_span)
                'controlPanelElements': ['play_pause', 'time_and_duration', 'mute', 'volume', 'spacer', 'quality', 'fullscreen'] 
            });

            [span_18](start_span)// Headers for new M3U[span_18](end_span)
            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                request.headers['Referer'] = 'https://tvbd.github.io/'; 
                request.headers['User-Agent'] = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
            });

            try {
                await player.load(channel.url);
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('channelName').textContent = channel.name;
                document.getElementById('channelLogo').src = channel.logo;
                channelInfo.classList.remove('hidden');
                setTimeout(showAlert, 3000); [span_19](start_span)// Popup after 3s[span_19](end_span)
            } catch (e) { console.error(e); }
        }

        async function main() {
            const id = getChannelIdFromUrl();
            const data = await fetchChannelData(id);
            if (data) initPlayer(data);
        }
        document.addEventListener('DOMContentLoaded', main);
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </script></body></html>
